<section id="servicios" class="relative px-5 py-16 md:px-10 md:py-24" data-testid="services-section">
    <p
        class="pointer-events-none absolute left-1 top-40 hidden origin-left -rotate-90 text-[10px] font-bold uppercase tracking-[0.5em] text-white/40 lg:block">
        Qué hacemos
    </p>

    <div class="mb-16 md:mb-24">
        <p class="mb-4 text-xs font-bold uppercase tracking-[0.4em] text-[#C6FF00]" data-testid="services-eyebrow">
            Servicios
        </p>
        <h2
            class="font-display text-[clamp(2.1rem,8.5vw,7rem)] font-extrabold uppercase leading-[0.9] tracking-tighter">
            <app-masked-line>
                Lo que <span class="text-stroke-lime">hacemos</span>
            </app-masked-line>
        </h2>
    </div>

    <div class="border-b border-white/15">
        @for (s of services; track s.num) {
        <article [attr.data-testid]="s.testId"
            class="service-row group relative grid cursor-pointer grid-cols-12 items-center gap-4 border-t border-white/15 py-10 transition-colors duration-500 hover:bg-[#C6FF00] md:py-14">
            <span
                class="text-stroke-white group-hover:text-stroke-black col-span-12 mb-2 pl-2 font-display text-[clamp(2.5rem,9vw,9rem)] font-extrabold leading-none transition-all duration-500 md:col-span-2 md:mb-0 md:pl-4">
                {{ s.num }}
            </span>
            <div class="col-span-12 md:col-span-5">
                <h3
                    class="font-display text-[clamp(1.8rem,5vw,4.5rem)] font-extrabold uppercase leading-none tracking-tighter text-white transition-colors duration-500 group-hover:text-black">
                    {{ s.title }}
                </h3>
            </div>
            <div class="col-span-12 md:col-span-4 md:col-start-8">
                <p
                    class="text-sm text-neutral-400 transition-colors duration-500 group-hover:text-black/70 md:text-base">
                    {{ s.desc }}
                </p>
                <div class="mt-4 flex flex-wrap gap-2">
                    @for (t of s.tags; track t) {
                    <span
                        class="border border-white/25 px-3 py-1 text-[10px] font-bold uppercase tracking-[0.2em] text-white/70 transition-colors duration-500 group-hover:border-black/40 group-hover:text-black">
                        {{ t }}
                    </span>
                    }
                </div>
            </div>
            <svg lucideArrowUpRight [size]="28" [strokeWidth]="2.5"
                class="absolute right-0 top-4 text-[#C6FF00] transition-all duration-500 group-hover:-translate-y-1 group-hover:translate-x-1 group-hover:text-black md:top-14 md:size-12"></svg>
        </article>
        }
    </div>
</section>
